<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MDT Finance — Coming soon</title>
  <meta name="description" content="MDT Finance is launching soon.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f172a'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='26' fill='%23facc15'>M</text></svg>">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #0f172a;
      --muted: #64748b;
      --accent: #b8860b;
      --line: #e2e2dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --accent: #facc15;
        --line: #1e2533;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    header, footer {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--muted);
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--fg);
      text-decoration: none;
    }
    .brand span { color: var(--accent); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 64px 0;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    h1 {
      font-size: clamp(40px, 9vw, 88px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-weight: 700;
      max-width: 14ch;
    }
    p.lead {
      margin-top: 24px;
      font-size: clamp(17px, 2.2vw, 20px);
      line-height: 1.55;
      color: var(--muted);
      max-width: 52ch;
    }
    .rule {
      margin-top: 48px;
      height: 1px;
      background: var(--line);
      max-width: 520px;
    }
    .contact {
      margin-top: 24px;
      font-size: 15px;
      color: var(--muted);
    }
    .contact a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 1px;
    }
    .contact a:hover { color: var(--accent); }
    footer { border-top: 1px solid var(--line); padding-top: 20px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">MDT<span>.</span>FINANCE</a>
  </header>

  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>Launching soon</div>
    <h1>Something new is on the way.</h1>
    <p class="lead">We're putting the finishing touches on MDT Finance. Check back shortly — the full site is coming soon.</p>
    <div class="rule"></div>
    <p class="contact">In the meantime, reach us at <a href="mailto:info@mdt.finance">info@mdt.finance</a></p>
  </main>

  <footer>
    <span>&copy; <span id="y">2026</span> MDT Finance</span>
    <span>mdt.finance</span>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
